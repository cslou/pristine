name: Public CI Gate

on:
  pull_request:
  push:
    branches:
      - main
      - sprint-*

jobs:
  deterministic-public-gate:
    name: Deterministic public gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:unit

      - name: Smoke tests
        run: pnpm run test:smoke

      - name: Build docs
        run: pnpm run docs:build

      - name: Verify package contents
        run: pnpm run verify:package
