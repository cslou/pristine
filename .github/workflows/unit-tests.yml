name: Public CI Gate

on:
  pull_request:
  push:
    branches:
      - main
      - sprint-*

jobs:
  deterministic-public-gate:
    name: Deterministic public gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Smoke tests
        run: npm run test:smoke

      - name: Deterministic integration tests
        run: SKIP_SLOW_TESTS=1 npm run test:integration

      - name: E2E tests
        run: npm run test:e2e

      - name: Verify package contents
        run: npm run verify:package
